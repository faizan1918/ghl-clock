<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GHL Live Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 12px;
  }

  .card {
    background: #ffffff;
    border: 1px solid #e4e7ec;
    border-radius: 12px;
    padding: 16px 20px;
    width: 100%;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #7c5cfc, #06b6d4);
    border-radius: 12px 12px 0 0;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }

  .client-name {
    font-size: 13px;
    font-weight: 700;
    color: #101828;
    line-height: 1.3;
    max-width: 200px;
  }

  .client-tz {
    font-size: 10px;
    color: #98a2b3;
    margin-top: 2px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #f9fafb;
    border: 1px solid #e4e7ec;
    border-radius: 20px;
    padding: 3px 8px;
    font-size: 9px;
    font-weight: 700;
    color: #98a2b3;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #12b76a;
    box-shadow: 0 0 4px #12b76a;
    animation: blink 2s infinite;
  }

  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .time-wrap {
    text-align: center;
    padding: 4px 0 10px;
  }

  .time-main {
    font-size: 44px;
    font-weight: 800;
    color: #101828;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .time-main .sec {
    font-size: 26px;
    font-weight: 600;
    color: #7c5cfc;
  }

  .time-main .ampm {
    font-size: 15px;
    font-weight: 600;
    color: #667085;
    margin-left: 4px;
    vertical-align: middle;
  }

  .date-line {
    font-size: 11px;
    color: #98a2b3;
    margin-top: 5px;
    font-weight: 500;
  }

  .divider {
    height: 1px;
    background: #f2f4f7;
    margin: 2px 0 10px;
  }

  .footer {
    display: flex;
    justify-content: flex-start;
    align-items: center;
  }

  .tz-text {
    font-size: 10px;
    color: #98a2b3;
  }

  /* Error */
  .error {
    text-align: center;
    padding: 10px 0;
  }
  .error p { font-size: 12px; color: #f04438; margin-bottom: 6px; }
  .error code {
    font-size: 11px; color: #667085;
    background: #f9fafb; padding: 4px 8px;
    border-radius: 4px; display: block; margin-top: 4px;
  }
</style>
</head>
<body>
<div class="card">
  <div id="clockScreen">
    <div class="header">
      <div>
        <div class="client-name" id="cName">—</div>
        <div class="client-tz" id="cTz">—</div>
      </div>
      <div class="live-badge">
        <div class="dot"></div>LIVE
      </div>
    </div>

    <div class="time-wrap">
      <div class="time-main">
        <span id="hh">--</span>:<span id="mm">--</span><span class="sec">:<span id="ss">--</span></span><span class="ampm" id="ampm"></span>
      </div>
      <div class="date-line" id="dateLine">—</div>
    </div>

    <div class="divider"></div>

    <div class="footer">
      <div class="tz-text">🕐 <span id="tzFooter">—</span></div>
    </div>
  </div>

  <div id="errorScreen" style="display:none;" class="error">
    <p>⚠️ Timezone not set!</p>
    <code>?tz=America/New_York</code>
  </div>
</div>

<script>
  const params   = new URLSearchParams(window.location.search);
  const TIMEZONE = params.get('tz');
  const NAME     = params.get('name') || 'Account Clock';

  if (!TIMEZONE) {
    document.getElementById('clockScreen').style.display = 'none';
    document.getElementById('errorScreen').style.display = 'block';
  } else {
    document.getElementById('cName').textContent = decodeURIComponent(NAME);

    function tick() {
      const now = new Date();
      const f = (opts) => new Intl.DateTimeFormat('en-US', { timeZone: TIMEZONE, ...opts }).format(now);
      try {
        document.getElementById('hh').textContent       = f({ hour: '2-digit', hour12: true }).replace(/ (AM|PM)/, '').padStart(2, '0');
        document.getElementById('mm').textContent       = f({ minute: '2-digit' }).padStart(2, '0');
        document.getElementById('ss').textContent       = f({ second: '2-digit' }).padStart(2, '0');
        document.getElementById('ampm').textContent     = f({ hour: '2-digit', hour12: true }).slice(-2);
        document.getElementById('dateLine').textContent = f({ weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const tzAbbr = now.toLocaleTimeString('en-US', { timeZone: TIMEZONE, timeZoneName: 'short' }).split(' ').pop();
        document.getElementById('cTz').textContent      = TIMEZONE;
        document.getElementById('tzFooter').textContent = `${TIMEZONE} (${tzAbbr})`;
      } catch(e) {
        document.getElementById('clockScreen').style.display = 'none';
        document.getElementById('errorScreen').style.display = 'block';
      }
    }

    tick();
    setInterval(tick, 1000);
  }
</script>
</body>
</html>
